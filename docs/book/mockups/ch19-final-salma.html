<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.fr{width:100%;aspect-ratio:16/9;border-radius:16px;position:relative;overflow:hidden;border:6px solid #111827;
background:radial-gradient(1.5px 1.5px at 10% 20%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 30% 12%,#fff 99%,transparent),radial-gradient(2px 2px at 48% 30%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 62% 8%,#fff 99%,transparent),radial-gradient(2px 2px at 85% 40%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 20% 45%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 92% 15%,#fff 99%,transparent),linear-gradient(#1e1b4b,#3730a3 70%,#4338ca)}
.moon{position:absolute;right:16%;top:12%;width:110px;height:110px;border-radius:50%;box-shadow:-22px 8px 0 0 #e5e7eb;filter:drop-shadow(0 0 14px rgba(255,255,255,.6))}
.hills{position:absolute;left:0;right:0;bottom:0;height:28%;background:#1e293b;clip-path:polygon(0 40%,15% 20%,35% 45%,55% 15%,75% 40%,100% 20%,100% 100%,0 100%)}
.house{position:absolute;left:8%;bottom:0;width:44%;height:78%;background:#c2884f;border-radius:6px 6px 0 0;box-shadow:inset 0 0 0 10px #a16207}
.win{position:absolute;left:14%;top:14%;width:72%;height:62%;background:#fef3c7;border:12px solid #78350f;border-radius:8px}
.girl{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:200px;height:250px}
.hair{position:absolute;left:28px;top:0;width:144px;height:140px;border-radius:50%;background:#5b3a1e;box-shadow:-18px 30px 0 -6px #5b3a1e,18px 30px 0 -6px #5b3a1e,-10px 60px 0 -10px #5b3a1e,10px 60px 0 -10px #5b3a1e}
.face{position:absolute;left:46px;top:28px;width:108px;height:112px;border-radius:50%;background:#f5c6a0}
.eye{position:absolute;top:48px;width:16px;height:20px;border-radius:50%;background:#3b2412;box-shadow:inset 4px -4px 0 0 #fff8}
.smile{position:absolute;left:38px;top:76px;width:32px;height:16px;border-radius:0 0 20px 20px;background:#b91c1c}
.ribbon{position:absolute;left:120px;top:4px;width:40px;height:22px;background:#facc15;clip-path:polygon(0 0,50% 40%,100% 0,100% 100%,50% 60%,0 100%)}
.body{position:absolute;left:30px;top:132px;width:140px;height:130px;border-radius:40px 40px 0 0;background:#f97316;color:#fff;font-size:44px;text-align:center;line-height:110px}
.strap{position:absolute;top:140px;width:14px;height:110px;background:#16a34a;border-radius:6px}
.arm{position:absolute;right:-16px;top:120px;width:24px;height:80px;background:#f97316;border-radius:12px;transform:rotate(35deg)}
.sub{position:absolute;left:0;right:0;bottom:6%;text-align:center;direction:rtl;font-size:26px;font-weight:bold;color:#fff;text-shadow:0 0 6px #000,0 0 6px #000}
.sub b{color:#fde047}
.title{position:absolute;right:4%;top:6%;direction:rtl;color:#fff;font-size:20px;background:rgba(0,0,0,.35);padding:6px 14px;border-radius:999px}
.cap{display:flex;gap:16px;justify-content:center;direction:rtl;margin-top:12px;font-size:14px}
.cap span{background:#f3f4f6;border-radius:999px;padding:4px 12px}
</style></head><body>
<div class="fr">
 <div class="moon"></div><div class="hills"></div>
 <div class="house"><div class="win"><div class="girl"><div class="hair"></div><div class="face"><span class="eye" style="left:26px"></span><span class="eye" style="left:66px"></span><span class="smile"></span></div><div class="ribbon"></div><div class="body">★</div><span class="strap" style="left:48px"></span><span class="strap" style="left:138px"></span><div class="arm"></div></div></div></div>
 <div class="title">سلمى والقمر الضائع 🌙</div>
 <div class="sub">سلمى: «عُدتَ! <b>كنتُ أعرف</b> أنّك ستعود!»</div>
</div>
<div class="cap"><span>المشهد 6 · 0:54–1:06</span><span>Contre-plongée</span><span>نفس البطاقة: شريط أصفر · قميص برتقالي بنجمة · حقيبة خضراء</span></div>
<p class="note">لقطة نهائية توضيحية (16:9) — الشخصية ثابتة لأن «بطاقة الهوية» نفسها نُسخت في كل برومبت</p>
</body></html>
