<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Tahoma, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937" direction="rtl">خريطة الكتاب: خمسة أجزاء من الصفر إلى الاحتراف</text>
  <text x="400" y="66" text-anchor="middle" font-size="14" fill="#1f2937">Carte du livre</text>
  <defs>
    <marker id="fl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <!-- Part 1 -->
  <rect x="560" y="100" width="210" height="150" rx="14" fill="#2563eb"/>
  <text x="665" y="132" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" direction="rtl">الجزء 1: الأساسيات</text>
  <text x="665" y="156" text-anchor="middle" font-size="13" fill="#ffffff">Les bases</text>
  <text x="755" y="186" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">1. ما هو الذكاء الاصطناعي؟</text>
  <text x="755" y="208" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">2. كيف تعمل النماذج اللغوية؟</text>
  <text x="755" y="230" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">3. الأخلاقيات والحدود</text>
  <!-- Part 2 -->
  <rect x="295" y="100" width="210" height="150" rx="14" fill="#7c3aed"/>
  <text x="400" y="132" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" direction="rtl">الجزء 2: هندسة البرومبت</text>
  <text x="400" y="156" text-anchor="middle" font-size="13" fill="#ffffff">Ingénierie de prompt</text>
  <text x="490" y="186" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">4. تشريح البرومبت الجيد</text>
  <text x="490" y="208" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">5. تقنيات متقدمة</text>
  <text x="490" y="230" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">6. مكتبة 50 قالباً</text>
  <!-- Part 3 -->
  <rect x="30" y="100" width="210" height="190" rx="14" fill="#16a34a"/>
  <text x="135" y="132" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" direction="rtl">الجزء 3: الأدوات</text>
  <text x="135" y="156" text-anchor="middle" font-size="13" fill="#ffffff">Les outils</text>
  <text x="225" y="182" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">7. المساعدات النصية</text>
  <text x="225" y="200" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">8. توليد الصور</text>
  <text x="225" y="218" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">9. تعديل الصور والتصميم</text>
  <text x="225" y="236" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">10. الصوت والموسيقى</text>
  <text x="225" y="254" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">11. الإنتاجية والأتمتة</text>
  <text x="225" y="272" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">12. تطبيقات بدون برمجة</text>
  <!-- arrows row 1 (RTL: right to left) -->
  <line x1="558" y1="175" x2="510" y2="175" stroke="#1f2937" stroke-width="3" marker-end="url(#fl)"/>
  <line x1="293" y1="175" x2="245" y2="175" stroke="#1f2937" stroke-width="3" marker-end="url(#fl)"/>
  <!-- down arrow to row 2 -->
  <path d="M135,292 L135,330 L220,330" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#fl)"/>
  <!-- Part 4 -->
  <rect x="230" y="320" width="300" height="200" rx="14" fill="#ea580c"/>
  <text x="380" y="352" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" direction="rtl">الجزء 4: صناعة الفيديو</text>
  <text x="380" y="376" text-anchor="middle" font-size="13" fill="#ffffff">Production vidéo</text>
  <text x="515" y="402" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">13. خريطة الإنتاج   14. السكريبت والستوريبورد</text>
  <text x="515" y="428" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">15. أدوات توليد الفيديو   16. الأفاتار</text>
  <text x="515" y="454" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">17. الصوت للفيديو   18. المونتاج</text>
  <text x="515" y="480" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">19. خمسة مشاريع فيديو كاملة</text>
  <line x1="532" y1="420" x2="570" y2="420" stroke="#1f2937" stroke-width="3" marker-end="url(#fl)"/>
  <!-- Part 5 -->
  <rect x="580" y="320" width="190" height="200" rx="14" fill="#1f2937"/>
  <text x="675" y="352" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" direction="rtl">الجزء 5: الاحتراف</text>
  <text x="675" y="376" text-anchor="middle" font-size="13" fill="#ffffff">Pro &amp; revenus</text>
  <text x="755" y="410" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">20. الربح من الذكاء الاصطناعي</text>
  <text x="755" y="436" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">21. خطة تعلّم 30 يوماً</text>
  <text x="755" y="462" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">الملاحق: قاموس، روابط،</text>
  <text x="755" y="482" text-anchor="start" font-size="13" fill="#ffffff" direction="rtl">ورقة مرجعية، قائمة تحقق</text>
  <text x="400" y="548" text-anchor="middle" font-size="13" fill="#1f2937" direction="rtl">اتّبع الأسهم: كل جزء يبني على الجزء الذي قبله</text>
</svg>