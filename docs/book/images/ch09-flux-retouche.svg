<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Tahoma, Arial, sans-serif">
<title>مسار تعديل صور المنتج</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<text x="400" y="38" font-size="20" fill="#1f2937" font-weight="bold" direction="rtl" text-anchor="middle">مسار تحويل صورة هاتف إلى صورة منتج احترافية</text>
<text x="400" y="62" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle" font-style="italic">Flux de retouche : de la photo brute au visuel e-commerce</text>
<rect x="560" y="100" width="200" height="130" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="738" cy="122" r="15" fill="#1f2937"/>
<text x="738" y="127" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="652.0" y="150" font-size="15" fill="#1f2937" font-weight="bold" direction="rtl" text-anchor="middle">صورة خام بالهاتف</text>
<text x="660.0" y="176" font-size="12" fill="#1f2937" font-weight="bold" text-anchor="middle" font-style="italic">Photo brute</text>
<text x="660.0" y="206" font-size="12" fill="#374151" font-weight="normal" direction="rtl" text-anchor="middle">إضاءة نهار، خلفية بسيطة</text>
<rect x="305" y="100" width="200" height="130" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="483" cy="122" r="15" fill="#2563eb"/>
<text x="483" y="127" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="397.0" y="150" font-size="15" fill="#1f2937" font-weight="bold" direction="rtl" text-anchor="middle">إزالة الخلفية</text>
<text x="405.0" y="176" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle" font-style="italic">Suppression d'arrière-plan</text>
<text x="405.0" y="206" font-size="12" fill="#374151" font-weight="normal" direction="rtl" text-anchor="middle">remove.bg / Canva</text>
<rect x="50" y="100" width="200" height="130" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="228" cy="122" r="15" fill="#7c3aed"/>
<text x="228" y="127" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="142.0" y="150" font-size="15" fill="#1f2937" font-weight="bold" direction="rtl" text-anchor="middle">خلفية أو مشهد جديد</text>
<text x="150.0" y="176" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-style="italic">Remplissage génératif</text>
<text x="150.0" y="206" font-size="12" fill="#374151" font-weight="normal" direction="rtl" text-anchor="middle">Photoshop / Firefly / Canva</text>
<rect x="50" y="290" width="200" height="130" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
<circle cx="228" cy="312" r="15" fill="#16a34a"/>
<text x="228" y="317" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="142.0" y="340" font-size="15" fill="#1f2937" font-weight="bold" direction="rtl" text-anchor="middle">تكبير وتحسين الدقة</text>
<text x="150.0" y="366" font-size="12" fill="#16a34a" font-weight="bold" text-anchor="middle" font-style="italic">Agrandissement (upscaling)</text>
<text x="150.0" y="396" font-size="12" fill="#374151" font-weight="normal" direction="rtl" text-anchor="middle">Upscayl / Topaz</text>
<rect x="305" y="290" width="200" height="130" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
<circle cx="483" cy="312" r="15" fill="#ea580c"/>
<text x="483" y="317" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<text x="397.0" y="340" font-size="15" fill="#1f2937" font-weight="bold" direction="rtl" text-anchor="middle">التصميم والنصوص</text>
<text x="405.0" y="366" font-size="12" fill="#ea580c" font-weight="bold" text-anchor="middle" font-style="italic">Mise en page</text>
<text x="405.0" y="396" font-size="12" fill="#374151" font-weight="normal" direction="rtl" text-anchor="middle">Canva: شعار، سعر، عرض</text>
<rect x="560" y="290" width="200" height="130" rx="14" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<circle cx="738" cy="312" r="15" fill="#0e7490"/>
<text x="738" y="317" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text>
<text x="652.0" y="340" font-size="15" fill="#1f2937" font-weight="bold" direction="rtl" text-anchor="middle">التصدير بالمقاسات</text>
<text x="660.0" y="366" font-size="12" fill="#0e7490" font-weight="bold" text-anchor="middle" font-style="italic">Export multi-formats</text>
<text x="660.0" y="396" font-size="12" fill="#374151" font-weight="normal" direction="rtl" text-anchor="middle">1:1 ، 4:5 ، 9:16</text>
<line x1="558" y1="165" x2="510" y2="165" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="303" y1="165" x2="255" y2="165" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="150" y1="232" x2="150" y2="286" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="252" y1="355" x2="300" y2="355" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="507" y1="355" x2="555" y2="355" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="400" y="450" font-size="12" fill="#6b7280" font-weight="normal" direction="rtl" text-anchor="middle">الاتجاه: من اليمين إلى اليسار في الصف الأول، ثم من اليسار إلى اليمين في الصف الثاني</text>
</svg>
