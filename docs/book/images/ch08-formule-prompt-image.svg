<rect x="410" y="240" width="170" height="120" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
<rect x="410" y="240" width="170" height="34" rx="12" fill="#7c3aed"/>
<rect x="410" y="260" width="170" height="14" fill="#7c3aed"/>
<text x="495" y="263" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">7. Couleurs</text>
<text x="495" y="302" font-size="15" fill="#1f2937" font-weight="bold" direction="rtl" text-anchor="middle">الألوان</text>
<text x="495" y="336" font-size="12" fill="#7c3aed" font-weight="normal" text-anchor="middle" font-style="italic">terre cuite et bleu</text>
<text x="590" y="306" font-size="20" fill="#9ca3af" font-weight="bold" text-anchor="middle">+</text>
<rect x="600" y="240" width="170" height="120" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<rect x="600" y="240" width="170" height="34" rx="12" fill="#1f2937"/>
<rect x="600" y="260" width="170" height="14" fill="#1f2937"/>
