<text x="495" y="186" font-size="12" fill="#16a34a" font-weight="normal" text-anchor="middle" font-style="italic">atelier à Safi</text>
<text x="590" y="156" font-size="20" fill="#9ca3af" font-weight="bold" text-anchor="middle">+</text>
<rect x="600" y="90" width="170" height="120" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
