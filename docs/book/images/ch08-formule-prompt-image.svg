<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Tahoma, Arial, sans-serif">
<title>صيغة برومبت الصورة</title>
<rect width="100%" height="100%" fill="#ffffff"/>
