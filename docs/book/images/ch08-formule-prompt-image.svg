<text x="685" y="302" font-size="15" fill="#1f2937" font-weight="bold" direction="rtl" text-anchor="middle">المعاملات التقنية</text>
<text x="685" y="336" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="middle" font-style="italic">--ar 4:5</text>
<rect x="30" y="395" width="740" height="88" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="400" y="420" font-size="13" fill="#1f2937" font-weight="bold" direction="rtl" text-anchor="middle">النتيجة بعد التجميع (النسخة الإنجليزية لأدوات الصور):</text>
<text x="400" y="446" font-size="13" fill="#374151" font-weight="normal" text-anchor="middle">A Moroccan potter shaping a clay vase, in a workshop in Safi, realistic photo,</text>
<text x="400" y="468" font-size="13" fill="#374151" font-weight="normal" text-anchor="middle">warm golden evening light, medium shot, terracotta and blue tones --ar 4:5</text>
</svg>
