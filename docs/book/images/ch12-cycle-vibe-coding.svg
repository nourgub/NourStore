<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Tahoma, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="38" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle" direction="rtl">دورة البرمجة بالوصف (Vibe coding)</text>
  <text x="400" y="62" font-size="14" fill="#1f2937" text-anchor="middle">Décrire → Générer → Tester → Corriger → Publier</text>
  <g font-size="14" text-anchor="middle" direction="rtl">
    <rect x="320" y="90" width="160" height="70" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="120" fill="#2563eb" font-weight="bold">① صِف</text>
    <text x="400" y="143" fill="#1f2937" font-size="12">Décrire (prompt)</text>
    <rect x="560" y="190" width="160" height="70" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="640" y="220" fill="#7c3aed" font-weight="bold">② ولِّد</text>
    <text x="640" y="243" fill="#1f2937" font-size="12">Générer</text>
    <rect x="320" y="290" width="160" height="70" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="400" y="320" fill="#ea580c" font-weight="bold">③ جرِّب</text>
    <text x="400" y="343" fill="#1f2937" font-size="12">Tester (ordi + mobile)</text>
    <rect x="80" y="190" width="160" height="70" rx="14" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
    <text x="160" y="220" fill="#ea580c" font-weight="bold">④ صحِّح</text>
    <text x="160" y="243" fill="#1f2937" font-size="12">Corriger (1 demande)</text>
  </g>
  <path d="M482,125 Q600,130 630,186" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <path d="M630,264 Q600,320 484,325" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <path d="M318,325 Q200,320 170,264" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <path d="M170,186 Q200,130 316,125" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <!-- publish exit -->
  <rect x="580" y="350" width="190" height="60" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="675" y="377" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle" direction="rtl">⑤ انشُر</text>
  <text x="675" y="398" font-size="12" fill="#1f2937" text-anchor="middle">Publier</text>
  <path d="M482,340 L576,375" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="400" y="228" font-size="13" fill="#1f2937" text-anchor="middle" direction="rtl">كرّر الدورة حتى تصبح</text>
  <text x="400" y="248" font-size="13" fill="#1f2937" text-anchor="middle" direction="rtl">النتيجة جيدة بما يكفي</text>
  <text x="200" y="420" font-size="12" fill="#1f2937" text-anchor="middle" direction="rtl">طلب واحد واضح في كل جولة = أخطاء أقل</text>
</svg>
