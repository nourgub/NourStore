<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Tahoma, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937" direction="rtl">الخط الزمني للمونتاج (Timeline de montage)</text>
  <!-- ruler -->
  <rect x="150" y="56" width="620" height="24" fill="#f3f4f6"/>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="150" y="73">0s</text><text x="253" y="73">5s</text><text x="357" y="73">10s</text>
    <text x="460" y="73">15s</text><text x="563" y="73">20s</text><text x="667" y="73">25s</text><text x="765" y="73">30s</text>
  </g>
  <!-- track labels (left column) -->
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <rect x="20" y="95" width="120" height="56" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="80" y="118" direction="rtl">النصوص</text><text x="80" y="138">Sous-titres</text>
    <rect x="20" y="161" width="120" height="56" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="80" y="184" direction="rtl">الفيديو</text><text x="80" y="204">Vidéo (V1)</text>
    <rect x="20" y="227" width="120" height="56" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="80" y="250" direction="rtl">الصوت</text><text x="80" y="270">Voix off (A1)</text>
    <rect x="20" y="293" width="120" height="56" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="80" y="316" direction="rtl">الموسيقى</text><text x="80" y="336">Musique (A2)</text>
    <rect x="20" y="359" width="120" height="56" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="80" y="382" direction="rtl">المؤثرات</text><text x="80" y="402">SFX (A3)</text>
  </g>
  <!-- subtitles -->
  <g fill="#ea580c">
    <rect x="160" y="105" width="90" height="36" rx="4"/><rect x="258" y="105" width="110" height="36" rx="4"/>
    <rect x="376" y="105" width="120" height="36" rx="4"/><rect x="504" y="105" width="100" height="36" rx="4"/>
    <rect x="612" y="105" width="150" height="36" rx="4"/>
  </g>
  <!-- video clips -->
  <g fill="#2563eb">
    <rect x="152" y="169" width="120" height="40" rx="4"/><rect x="274" y="169" width="140" height="40" rx="4"/>
    <rect x="416" y="169" width="110" height="40" rx="4"/><rect x="528" y="169" width="130" height="40" rx="4"/>
    <rect x="660" y="169" width="108" height="40" rx="4"/>
  </g>
  <g font-size="12" fill="#ffffff" text-anchor="middle">
    <text x="212" y="194">Plan 1</text><text x="344" y="194">Plan 2</text><text x="471" y="194">Plan 3</text>
    <text x="593" y="194">Plan 4</text><text x="714" y="194">CTA</text>
  </g>
  <!-- voice -->
  <rect x="160" y="237" width="600" height="36" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <polyline points="160,255 175,245 190,265 205,242 220,268 240,250 260,255 280,244 300,266 320,248 340,262 360,255 380,255 400,243 420,267 440,247 460,263 480,255 500,255 520,245 540,265 560,249 580,261 600,255 620,244 640,266 660,250 680,262 700,246 720,264 740,255 760,255" fill="none" stroke="#2563eb" stroke-width="2"/>
  <!-- music with ducking -->
  <rect x="152" y="303" width="616" height="36" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <polyline points="152,310 165,310 175,330 750,330 760,310 768,310" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="460" y="326" text-anchor="middle" font-size="12" fill="#7c3aed">Ducking -20 dB</text>
  <!-- sfx -->
  <g fill="#16a34a">
    <rect x="268" y="369" width="22" height="36" rx="3"/><rect x="410" y="369" width="22" height="36" rx="3"/>
    <rect x="522" y="369" width="22" height="36" rx="3"/><rect x="655" y="369" width="40" height="36" rx="3"/>
  </g>
  <text x="560" y="392" font-size="12" fill="#16a34a" direction="rtl">Whoosh</text>
  <!-- playhead -->
  <line x1="460" y1="52" x2="460" y2="420" stroke="#dc2626" stroke-width="2"/>
  <polygon points="452,52 468,52 460,62" fill="#dc2626"/>
  <text x="400" y="450" text-anchor="middle" font-size="13" fill="#1f2937" direction="rtl">رأس القراءة (Tête de lecture) — كل مسار طبقة مستقلة يمكن ضبطها وحدها</text>
</svg>
