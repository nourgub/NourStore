<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Tahoma, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937" direction="rtl">ورقة الشخصية المرجعية (Fiche personnage) — «سلمى»</text>
  <!-- three views -->
  <g>
    <!-- face view -->
    <rect x="40" y="60" width="200" height="260" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="140" cy="130" r="38" fill="#fde68a" stroke="#1f2937"/>
    <path d="M102 120 Q140 70 178 120" fill="#7c2d12"/>
    <circle cx="128" cy="130" r="4" fill="#1f2937"/><circle cx="152" cy="130" r="4" fill="#1f2937"/>
    <path d="M128 148 Q140 156 152 148" fill="none" stroke="#1f2937" stroke-width="2"/>
    <rect x="110" y="170" width="60" height="90" rx="10" fill="#ea580c"/>
    <rect x="114" y="260" width="20" height="40" fill="#2563eb"/><rect x="146" y="260" width="20" height="40" fill="#2563eb"/>
    <text x="140" y="312" text-anchor="middle" font-size="13" fill="#2563eb">Vue de face</text>
    <!-- profile -->
    <rect x="300" y="60" width="200" height="260" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <ellipse cx="400" cy="130" rx="32" ry="38" fill="#fde68a" stroke="#1f2937"/>
    <path d="M368 125 Q385 78 432 112 L420 125 Z" fill="#7c2d12"/>
    <circle cx="418" cy="130" r="4" fill="#1f2937"/>
    <rect x="378" y="170" width="44" height="90" rx="10" fill="#ea580c"/>
    <rect x="388" y="260" width="22" height="40" fill="#2563eb"/>
    <text x="400" y="312" text-anchor="middle" font-size="13" fill="#7c3aed">Profil</text>
    <!-- expressions -->
    <rect x="560" y="60" width="200" height="260" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <circle cx="615" cy="115" r="26" fill="#fde68a" stroke="#1f2937"/>
    <path d="M603 122 Q615 132 627 122" fill="none" stroke="#1f2937" stroke-width="2"/>
    <circle cx="705" cy="115" r="26" fill="#fde68a" stroke="#1f2937"/>
    <ellipse cx="705" cy="126" rx="6" ry="8" fill="#1f2937"/>
    <circle cx="615" cy="215" r="26" fill="#fde68a" stroke="#1f2937"/>
    <path d="M603 228 Q615 218 627 228" fill="none" stroke="#1f2937" stroke-width="2"/>
    <circle cx="705" cy="215" r="26" fill="#fde68a" stroke="#1f2937"/>
    <line x1="695" y1="226" x2="715" y2="226" stroke="#1f2937" stroke-width="2"/>
    <g font-size="11" fill="#1f2937" text-anchor="middle">
      <text x="615" y="158" direction="rtl">فرح</text><text x="705" y="158" direction="rtl">دهشة</text>
      <text x="615" y="258" direction="rtl">حزن</text><text x="705" y="258" direction="rtl">تفكير</text>
    </g>
    <text x="660" y="312" text-anchor="middle" font-size="13" fill="#16a34a">Expressions</text>
  </g>
  <!-- palette -->
  <text x="760" y="356" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2937" direction="rtl">لوحة الألوان الثابتة (Palette)</text>
  <g font-size="11" fill="#1f2937" text-anchor="middle">
    <rect x="700" y="370" width="60" height="34" fill="#fde68a" stroke="#1f2937"/><text x="730" y="420" direction="rtl">البشرة</text>
    <rect x="630" y="370" width="60" height="34" fill="#7c2d12"/><text x="660" y="420" direction="rtl">الشعر</text>
    <rect x="560" y="370" width="60" height="34" fill="#ea580c"/><text x="590" y="420" direction="rtl">القميص</text>
    <rect x="490" y="370" width="60" height="34" fill="#2563eb"/><text x="520" y="420" direction="rtl">السروال</text>
  </g>
  <!-- traits -->
  <rect x="40" y="345" width="420" height="160" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <g font-size="13" fill="#1f2937" text-anchor="end" direction="rtl">
    <text x="445" y="372" font-weight="bold" text-anchor="start">العلامات الثابتة (Traits fixes):</text>
    <text x="445" y="398" text-anchor="start">• بنت 7 سنوات، شعر بنّي مجعّد بشريط أصفر</text>
    <text x="445" y="422" text-anchor="start">• عينان كبيرتان بنيّتان، نمش خفيف</text>
    <text x="445" y="446" text-anchor="start">• قميص برتقالي بنجمة بيضاء، سروال أزرق</text>
    <text x="445" y="470" text-anchor="start">• حذاء رياضي أبيض، حقيبة ظهر خضراء</text>
    <text x="445" y="494" text-anchor="start">• الأسلوب: ثلاثي الأبعاد كرتوني، ألوان دافئة</text>
  </g>
  <text x="625" y="470" text-anchor="middle" font-size="12" fill="#6b7280" direction="rtl">انسخ هذه الأوصاف حرفياً</text>
  <text x="625" y="490" text-anchor="middle" font-size="12" fill="#6b7280" direction="rtl">في كل برومبت لكل مشهد</text>
</svg>