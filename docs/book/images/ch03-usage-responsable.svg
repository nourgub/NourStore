<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Tahoma, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="40" font-size="24" font-weight="bold" fill="#1f2937" text-anchor="middle" direction="rtl">دورة الاستعمال المسؤول قبل أي نشر</text>
  <g font-size="15" text-anchor="middle">
    <rect x="640" y="80" width="130" height="120" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="705" y="118" font-size="26" fill="#2563eb">١</text>
    <text x="705" y="150" font-weight="bold" fill="#1f2937" direction="rtl">ولِّد</text>
    <text x="705" y="175" fill="#2563eb" font-size="13">Générer</text>
    <rect x="485" y="80" width="130" height="120" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="550" y="118" font-size="26" fill="#7c3aed">٢</text>
    <text x="550" y="150" font-weight="bold" fill="#1f2937" direction="rtl">تحقّق</text>
    <text x="550" y="175" fill="#7c3aed" font-size="13">Vérifier</text>
    <rect x="330" y="80" width="130" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="395" y="118" font-size="26" fill="#16a34a">٣</text>
    <text x="395" y="150" font-weight="bold" fill="#1f2937" direction="rtl">صحّح وأضف لمستك</text>
    <text x="395" y="175" fill="#16a34a" font-size="13">Corriger</text>
    <rect x="175" y="80" width="130" height="120" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="240" y="118" font-size="26" fill="#ea580c">٤</text>
    <text x="240" y="150" font-weight="bold" fill="#1f2937" direction="rtl">راجع الحقوق</text>
    <text x="240" y="175" fill="#ea580c" font-size="13">Droits / Consentement</text>
    <rect x="20" y="80" width="130" height="120" rx="14" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
    <text x="85" y="118" font-size="26" fill="#1f2937">٥</text>
    <text x="85" y="150" font-weight="bold" fill="#1f2937" direction="rtl">وسِّم وانشر</text>
    <text x="85" y="175" fill="#1f2937" font-size="13">Étiqueter</text>
  </g>
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <path d="M637 140 L620 140"/><path d="M627 133 L618 140 L627 147"/>
    <path d="M482 140 L465 140"/><path d="M472 133 L463 140 L472 147"/>
    <path d="M327 140 L310 140"/><path d="M317 133 L308 140 L317 147"/>
    <path d="M172 140 L155 140"/><path d="M162 133 L153 140 L162 147"/>
  </g>
  <rect x="60" y="235" width="680" height="70" rx="12" fill="#f9fafb" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="265" font-size="16" fill="#1f2937" text-anchor="middle" direction="rtl">لا معلومات شخصية حساسة في البرومبت · لا وجه ولا صوت دون موافقة</text>
  <text x="400" y="290" font-size="16" fill="#1f2937" text-anchor="middle" direction="rtl">أنت المسؤول عن النتيجة النهائية، لا الأداة</text>
