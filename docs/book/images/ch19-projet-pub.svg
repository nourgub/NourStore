<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Tahoma, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937" direction="rtl">ستوريبورد إعلان العطر «ياسمين» — 25 ثانية</text>
  <!-- 6 panels, 3 per row, ordered right-to-left -->
  <g font-size="12" fill="#1f2937">
    <!-- row 1 -->
    <rect x="540" y="60" width="230" height="130" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="655" cy="125" r="34" fill="#ffffff" stroke="#7c3aed"/>
    <text x="655" y="130" text-anchor="middle" font-size="12" fill="#7c3aed">Macro</text>
    <rect x="300" y="60" width="230" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="395" y="85" width="40" height="75" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="415" y="178" text-anchor="middle" fill="#2563eb">Travelling</text>
    <rect x="60" y="60" width="230" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <path d="M90 170 Q175 80 260 170" fill="none" stroke="#16a34a" stroke-width="2"/>
    <text x="175" y="130" text-anchor="middle" fill="#16a34a">Plan large</text>
    <!-- captions row 1 -->
    <text x="760" y="212" text-anchor="start" font-weight="bold" direction="rtl">1 · 0–4ث: زهرة ياسمين بقطرة ندى</text>
    <text x="760" y="230" text-anchor="start" direction="rtl">صوت: «كلّ صباح يبدأ بعطر…»</text>
    <text x="520" y="212" text-anchor="start" font-weight="bold" direction="rtl">2 · 4–9ث: القارورة على رخام</text>
    <text x="520" y="230" text-anchor="start" direction="rtl">كاميرا تدور ببطء حولها</text>
    <text x="280" y="212" text-anchor="start" font-weight="bold" direction="rtl">3 · 9–14ث: فناء رياض مغربي</text>
    <text x="280" y="230" text-anchor="start" direction="rtl">امرأة تمشي، ضوء الغروب</text>
    <!-- row 2 -->
    <rect x="540" y="260" width="230" height="130" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <circle cx="655" cy="320" r="22" fill="#ffffff" stroke="#ea580c"/>
    <text x="655" y="375" text-anchor="middle" fill="#ea580c">Gros plan</text>
    <rect x="300" y="260" width="230" height="130" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="390" y="285" width="50" height="80" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="415" y="380" text-anchor="middle" fill="#7c3aed">Packshot</text>
    <rect x="60" y="260" width="230" height="130" rx="8" fill="#1f2937"/>
    <text x="175" y="318" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">-20%</text>
    <text x="175" y="345" text-anchor="middle" font-size="13" fill="#ffffff" direction="rtl">اطلبيه الآن</text>
    <!-- captions row 2 -->
    <text x="760" y="412" text-anchor="start" font-weight="bold" direction="rtl">4 · 14–18ث: رشّة على المعصم</text>
    <text x="760" y="430" text-anchor="start" direction="rtl">رذاذ يلمع بالضوء</text>
    <text x="520" y="412" text-anchor="start" font-weight="bold" direction="rtl">5 · 18–22ث: لقطة المنتج النهائية</text>
    <text x="520" y="430" text-anchor="start" direction="rtl">الاسم + الشعار يظهران</text>
    <text x="280" y="412" text-anchor="start" font-weight="bold" direction="rtl">6 · 22–25ث: دعوة للفعل (CTA)</text>
    <text x="280" y="430" text-anchor="start" direction="rtl">العرض + رابط المتجر</text>
  </g>
  <!-- flow arrows -->
  <g stroke="#1f2937" stroke-width="2" fill="#1f2937">
    <line x1="538" y1="125" x2="534" y2="125"/>
    <polygon points="532,125 540,120 540,130"/>
    <polygon points="292,125 300,120 300,130"/>
    <polygon points="532,325 540,320 540,330"/>
    <polygon points="292,325 300,320 300,330"/>
  </g>
  <rect x="60" y="460" width="710" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="415" y="488" text-anchor="middle" font-size="13" fill="#1f2937" direction="rtl">الموسيقى: عود + بيانو هادئ · الإيقاع: بطيء ثم يتسارع في اللقطة 4 · اتجاه القراءة من اليمين إلى اليسار</text>
</svg>