<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Tahoma, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="40" font-size="24" font-weight="bold" fill="#1f2937" text-anchor="middle" direction="rtl">النموذج يتوقّع الرمز التالي… والحرارة تتحكم في الاختيار</text>
  <rect x="40" y="80" width="300" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="117" font-size="18" fill="#1f2937" text-anchor="middle">Le thé à la menthe est …</text>
  <path d="M345 110 L400 110" stroke="#1f2937" stroke-width="3"/>
  <path d="M390 100 L405 110 L390 120" fill="none" stroke="#1f2937" stroke-width="3"/>
  <g font-size="16" fill="#1f2937">
    <text x="420" y="95">délicieux</text><rect x="530" y="80" width="200" height="20" fill="#16a34a"/><text x="740" y="96">62%</text>
    <text x="420" y="130">sucré</text><rect x="530" y="115" width="80" height="20" fill="#2563eb"/><text x="620" y="131">25%</text>
    <text x="420" y="165">chaud</text><rect x="530" y="150" width="32" height="20" fill="#7c3aed"/><text x="572" y="166">10%</text>
    <text x="420" y="200">bleu</text><rect x="530" y="185" width="8" height="20" fill="#ea580c"/><text x="548" y="201">3%</text>
  </g>
  <rect x="40" y="240" width="350" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="272" font-size="18" font-weight="bold" fill="#16a34a" text-anchor="start" direction="rtl">حرارة منخفضة (0.2)</text>
  <text x="370" y="304" font-size="15" fill="#1f2937" text-anchor="start" direction="rtl">يختار دائماً الأكثر احتمالاً:</text>
  <text x="370" y="332" font-size="15" fill="#1f2937" text-anchor="end">« délicieux »</text>
  <text x="370" y="364" font-size="15" fill="#1f2937" text-anchor="start" direction="rtl">مناسبة للوقائع والملخصات والكود</text>
  <rect x="410" y="240" width="350" height="150" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="740" y="272" font-size="18" font-weight="bold" fill="#ea580c" text-anchor="start" direction="rtl">حرارة مرتفعة (1.0)</text>
  <text x="740" y="304" font-size="15" fill="#1f2937" text-anchor="start" direction="rtl">يجرّب أحياناً خيارات أقل احتمالاً:</text>
  <text x="740" y="332" font-size="15" fill="#1f2937" text-anchor="end">« sucré » ، « chaud » …</text>
  <text x="740" y="364" font-size="15" fill="#1f2937" text-anchor="start" direction="rtl">مناسبة للأفكار والشعر والإبداع</text>
</svg>