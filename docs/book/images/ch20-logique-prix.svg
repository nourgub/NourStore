<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Tahoma, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937" direction="rtl">معادلة التسعير: كيف تحسب سعر خدمتك؟</text>
  <text x="400" y="66" text-anchor="middle" font-size="14" fill="#1f2937">Logique de tarification</text>
  <rect x="600" y="110" width="170" height="130" rx="14" fill="#2563eb"/>
  <text x="685" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" direction="rtl">الوقت</text>
  <text x="685" y="172" text-anchor="middle" font-size="13" fill="#ffffff">Temps</text>
  <text x="685" y="200" text-anchor="middle" font-size="12" fill="#ffffff" direction="rtl">ساعات × سعر ساعتك</text>
  <text x="560" y="185" text-anchor="middle" font-size="34" font-weight="bold" fill="#1f2937">+</text>
  <rect x="380" y="110" width="150" height="130" rx="14" fill="#7c3aed"/>
  <text x="455" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" direction="rtl">التكاليف</text>
  <text x="455" y="172" text-anchor="middle" font-size="13" fill="#ffffff">Coûts</text>
  <text x="455" y="200" text-anchor="middle" font-size="12" fill="#ffffff" direction="rtl">اشتراكات الأدوات</text>
  <text x="345" y="185" text-anchor="middle" font-size="34" font-weight="bold" fill="#1f2937">+</text>
  <rect x="160" y="110" width="150" height="130" rx="14" fill="#16a34a"/>
  <text x="235" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" direction="rtl">القيمة</text>
  <text x="235" y="172" text-anchor="middle" font-size="13" fill="#ffffff">Valeur</text>
  <text x="235" y="200" text-anchor="middle" font-size="12" fill="#ffffff" direction="rtl">ماذا يربح الزبون؟</text>
  <text x="125" y="185" text-anchor="middle" font-size="34" font-weight="bold" fill="#1f2937">=</text>
  <rect x="20" y="110" width="80" height="130" rx="14" fill="#ea580c"/>
  <text x="60" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" direction="rtl">السعر</text>
  <text x="60" y="194" text-anchor="middle" font-size="12" fill="#ffffff">Prix</text>
  <rect x="40" y="280" width="720" height="110" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="740" y="312" text-anchor="start" font-size="14" font-weight="bold" fill="#1f2937" direction="rtl">ثلاث باقات (Forfaits) تسهّل القرار على الزبون:</text>
  <text x="740" y="342" text-anchor="start" font-size="13" fill="#2563eb" direction="rtl">أساسية (Basique): الحد الأدنى المفيد  ·  قياسية (Standard): الأكثر طلباً  ·  مميزة (Premium): كل شيء + سرعة</text>
  <text x="740" y="372" text-anchor="start" font-size="13" fill="#1f2937" direction="rtl">لا تبِع «ساعات الأداة»، بِع «النتيجة»: زبائن أكثر، وقت أقل، صورة أجمل للمحل.</text>
</svg>