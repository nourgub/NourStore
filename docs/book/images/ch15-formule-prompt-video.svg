<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Tahoma, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="400" y="36" text-anchor="middle" direction="rtl" font-size="22" font-weight="bold" fill="#1f2937">المعادلة الذهبية لبرومبت الفيديو</text>
<text x="400" y="58" text-anchor="middle" font-size="14" fill="#1f2937">Formule maîtresse du prompt vidéo — 9 blocs</text>
<rect x="650" y="85" width="135" height="120" rx="12" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="2"/>
<circle cx="767" cy="103" r="11" fill="#2563eb"/><text x="767" y="108" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>
<text x="717" y="135" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1f2937">نوع اللقطة</text>
<text x="717" y="157" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="bold">[Type de plan]</text>
<text x="717" y="185" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">Plan large</text>
<text x="642" y="151" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">+</text>
<rect x="500" y="85" width="135" height="120" rx="12" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-width="2"/>
<circle cx="617" cy="103" r="11" fill="#7c3aed"/><text x="617" y="108" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">2</text>
<text x="567" y="135" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1f2937">الموضوع</text>
<text x="567" y="157" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="bold">[Sujet]</text>
<text x="567" y="185" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">une potière</text>
<text x="492" y="151" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">+</text>
<rect x="350" y="85" width="135" height="120" rx="12" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
<circle cx="467" cy="103" r="11" fill="#16a34a"/><text x="467" y="108" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">3</text>
<text x="417" y="135" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1f2937">الفعل</text>
<text x="417" y="157" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">[Action]</text>
<text x="417" y="185" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">façonne un vase</text>
<text x="342" y="151" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">+</text>
<rect x="200" y="85" width="135" height="120" rx="12" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-width="2"/>
<circle cx="317" cy="103" r="11" fill="#ea580c"/><text x="317" y="108" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">4</text>
<text x="267" y="135" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1f2937">المكان</text>
<text x="267" y="157" text-anchor="middle" font-size="12" fill="#ea580c" font-weight="bold">[Décor]</text>
<text x="267" y="185" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">atelier à Safi</text>
<text x="192" y="151" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">+</text>
<rect x="50" y="85" width="135" height="120" rx="12" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="2"/>
<circle cx="167" cy="103" r="11" fill="#2563eb"/><text x="167" y="108" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">5</text>
<text x="117" y="135" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1f2937">الإضاءة</text>
<text x="117" y="157" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="bold">[Lumière]</text>
<text x="117" y="185" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">heure dorée</text>
<rect x="575" y="235" width="135" height="120" rx="12" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-width="2"/>
<circle cx="692" cy="253" r="11" fill="#7c3aed"/><text x="692" y="258" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">6</text>
<text x="642" y="285" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1f2937">حركة الكاميرا</text>
<text x="642" y="307" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="bold">[Mouvement]</text>
<text x="642" y="335" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">travelling lent</text>
<text x="567" y="301" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">+</text>
<rect x="425" y="235" width="135" height="120" rx="12" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
<circle cx="542" cy="253" r="11" fill="#16a34a"/><text x="542" y="258" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">7</text>
<text x="492" y="285" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1f2937">الأسلوب</text>
<text x="492" y="307" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">[Style]</text>
<text x="492" y="335" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">cinématique 35mm</text>
<text x="417" y="301" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">+</text>
<rect x="275" y="235" width="135" height="120" rx="12" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-width="2"/>
<circle cx="392" cy="253" r="11" fill="#ea580c"/><text x="392" y="258" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">8</text>
<text x="342" y="285" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1f2937">الجو</text>
<text x="342" y="307" text-anchor="middle" font-size="12" fill="#ea580c" font-weight="bold">[Ambiance]</text>
<text x="342" y="335" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">calme, chaleureux</text>
<text x="267" y="301" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">+</text>
<rect x="125" y="235" width="135" height="120" rx="12" fill="#1f2937" fill-opacity="0.1" stroke="#1f2937" stroke-width="2"/>
<circle cx="242" cy="253" r="11" fill="#1f2937"/><text x="242" y="258" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">9</text>
<text x="192" y="285" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1f2937">المدة</text>
<text x="192" y="307" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="bold">[Durée]</text>
<text x="192" y="335" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">8 secondes</text>
<rect x="40" y="395" width="720" height="58" rx="10" fill="#1f2937"/>
<text x="400" y="420" text-anchor="middle" font-size="12" fill="#ffffff">Plan large, une potière façonne un vase dans un atelier à Safi, heure dorée,</text>
<text x="400" y="440" text-anchor="middle" font-size="12" fill="#ffffff">travelling lent vers l'avant, style cinématique 35mm, ambiance calme et chaleureuse, 8 secondes</text>
</svg>