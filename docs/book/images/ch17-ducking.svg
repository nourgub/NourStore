<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Tahoma, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937" direction="rtl">خفض الموسيقى تلقائياً تحت الصوت (Ducking)</text>
  <!-- voice track -->
  <text x="780" y="90" text-anchor="end" font-size="15" font-weight="bold" fill="#2563eb" direction="rtl">مسار الصوت (Voix)</text>
  <rect x="40" y="100" width="720" height="70" fill="#eff6ff" stroke="#2563eb" rx="6"/>
  <rect x="190" y="112" width="200" height="46" fill="#2563eb" rx="4"/>
  <text x="290" y="141" text-anchor="middle" font-size="14" fill="#ffffff" direction="rtl">الجملة 1</text>
  <rect x="470" y="112" width="190" height="46" fill="#2563eb" rx="4"/>
  <text x="565" y="141" text-anchor="middle" font-size="14" fill="#ffffff" direction="rtl">الجملة 2</text>
  <!-- music track -->
  <text x="780" y="210" text-anchor="end" font-size="15" font-weight="bold" fill="#7c3aed" direction="rtl">مسار الموسيقى (Musique)</text>
  <rect x="40" y="220" width="720" height="100" fill="#f5f3ff" stroke="#7c3aed" rx="6"/>
  <!-- envelope: high -10 at y=240, low -22 at y=295 -->
  <polyline points="40,240 170,240 190,295 390,295 410,240 450,240 470,295 660,295 680,240 760,240" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <circle cx="170" cy="240" r="5" fill="#ea580c"/>
  <circle cx="190" cy="295" r="5" fill="#ea580c"/>
  <circle cx="390" cy="295" r="5" fill="#ea580c"/>
  <circle cx="410" cy="240" r="5" fill="#ea580c"/>
  <text x="105" y="235" text-anchor="middle" font-size="13" fill="#7c3aed">-10 dB</text>
  <text x="290" y="288" text-anchor="middle" font-size="13" fill="#7c3aed">-22 dB</text>
  <text x="565" y="288" text-anchor="middle" font-size="13" fill="#7c3aed">-22 dB</text>
  <text x="720" y="235" text-anchor="middle" font-size="13" fill="#7c3aed">-10 dB</text>
  <!-- annotations -->
  <line x1="180" y1="330" x2="180" y2="345" stroke="#ea580c" stroke-width="2"/>
  <text x="180" y="362" text-anchor="middle" font-size="13" fill="#ea580c" direction="rtl">نزول ناعم 0.3 ث (Fondu)</text>
  <line x1="400" y1="330" x2="400" y2="345" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="362" text-anchor="middle" font-size="13" fill="#ea580c" direction="rtl">صعود ناعم 0.5 ث</text>
  <text x="620" y="362" text-anchor="middle" font-size="13" fill="#16a34a" direction="rtl">النقاط البرتقالية = إطارات مفتاحية (Keyframes)</text>
</svg>
