# Checks on every push and pull request: types, unit tests, migrations on an
# empty MySQL, the real-database tests, and the production build. Browser
# tests (Playwright) run locally: tests/e2e/README.md.
name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: tafawoq_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JWT_SECRET: ci-only-secret-at-least-sixteen-chars
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/tafawoq_test
      TAFAWOQ_DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/tafawoq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run test:unit
      - run: node scripts/migrate.mjs
      - run: npm run test:db
      - run: npm run build
