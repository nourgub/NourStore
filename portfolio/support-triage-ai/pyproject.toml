[project]
name = "enterprise-ai-automation-platform"
version = "0.1.0"
description = "Safe AI-assisted customer operations workflow automation prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.5",
  "scikit-learn==1.6.1",
  "numpy==2.2.2",
  "httpx==0.28.1",
  "pytest==8.3.4",
  "matplotlib==3.10.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
