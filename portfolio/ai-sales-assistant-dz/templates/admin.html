<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة {{ store_name }}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="shell">
  <section class="hero">
    <span class="eyebrow">لوحة الإدارة · {{ store_name }}</span>
    <h1>الطلبات والمنتجات</h1>
  </section>

  <section class="panel" id="login-panel">
    <form id="login-form" class="stack-form">
      <label for="username">اسم المستخدم</label>
      <input id="username" autocomplete="username" required maxlength="40">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" required maxlength="200">
      <button>دخول</button>
    </form>
    <p class="muted" id="login-message" role="status"></p>
  </section>

  <section class="panel" id="app-panel" hidden>
    <div class="toolbar between">
      <nav class="tabs" aria-label="الأقسام">
        <button type="button" class="tab" data-tab="orders">الطلبات</button>
        <button type="button" class="tab" data-tab="products" data-role="admin">المنتجات</button>
        <button type="button" class="tab" data-tab="users" data-role="admin">المستخدمون</button>
      </nav>
      <div class="who"><span id="who"></span> <button type="button" class="secondary" id="logout">خروج</button></div>
    </div>
    <p class="muted" id="message" role="status"></p>

    <div id="tab-orders" class="tab-body">
      <form class="toolbar" id="order-filter">
        <input id="order-q" placeholder="رقم الطلب، الهاتف، الاسم أو الولاية" maxlength="100" aria-label="بحث في الطلبات">
        <select id="order-status" aria-label="الحالة"><option value="">كل الحالات</option></select>
        <button>بحث</button>
      </form>
      <div class="table-wrap" id="orders"></div>
      <div class="pager" id="orders-pager"></div>
    </div>

    <div id="tab-products" class="tab-body" hidden>
      <form class="toolbar" id="product-filter">
        <input id="product-q" placeholder="اسم المنتج أو الفئة" maxlength="100" aria-label="بحث في المنتجات">
        <button>بحث</button>
      </form>
      <details class="card-form">
        <summary>إضافة منتج</summary>
        <form id="product-form" class="grid-form">
          <input id="p-name" placeholder="الاسم" required maxlength="120" aria-label="الاسم">
          <input id="p-category" placeholder="الفئة" maxlength="40" aria-label="الفئة">
          <input id="p-price" type="number" min="0" step="1" placeholder="السعر (DA)" required aria-label="السعر">
          <input id="p-stock" type="number" min="0" step="1" placeholder="المخزون" required aria-label="المخزون">
          <button>إضافة</button>
        </form>
      </details>
      <div class="table-wrap" id="products"></div>
      <div class="pager" id="products-pager"></div>
    </div>

    <div id="tab-users" class="tab-body" hidden>
      <details class="card-form">
        <summary>إضافة مستخدم</summary>
        <form id="user-form" class="grid-form">
          <input id="u-name" placeholder="اسم المستخدم" required maxlength="40" aria-label="اسم المستخدم">
          <input id="u-password" type="password" placeholder="كلمة مرور (12 حرفًا أو أكثر)" required minlength="12" maxlength="200" autocomplete="new-password" aria-label="كلمة المرور">
          <select id="u-role" aria-label="الدور"><option value="staff">staff</option><option value="admin">admin</option></select>
          <button>إضافة</button>
        </form>
      </details>
      <div class="table-wrap" id="users"></div>
    </div>
  </section>
</main>
<script src="/static/admin.js"></script>
</body>
</html>
