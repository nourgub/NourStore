<!doctype html><html><head><meta charset="utf-8"><title>Enterprise AI Automation Platform</title><style>body{font:15px system-ui;margin:0;background:#f5f7fb;color:#172033}header{background:#12213a;color:#fff;padding:24px 5%}main{max-width:1200px;margin:24px auto;padding:0 20px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:#fff;padding:18px;border-radius:10px;min-width:150px;box-shadow:0 2px 8px #dfe4ef}.num{font-size:28px;font-weight:700}table{width:100%;background:#fff;border-collapse:collapse;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #e7ebf2;text-align:left}button{padding:7px 12px;border:0;border-radius:5px;background:#1b64d8;color:#fff;cursor:pointer}.review{background:#fff;padding:16px;margin-top:20px;border-left:4px solid #e29b18;border-radius:6px}small{color:#667}</style></head><body><header><h1>Enterprise AI Automation Platform</h1><div>Customer operations · AI orchestration · human control</div></header><main><div class="cards" id="cards"></div><h2>Human review queue</h2><div id="queue"></div><h2>Recent workflows</h2><table><thead><tr><th>ID</th><th>Request</th><th>Intent</th><th>Confidence</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></main><script>async function load(){let xs=await (await fetch('/requests')).json();let counts=Object.fromEntries(xs.map(x=>[x.status,(Object.fromEntries([])[x.status]||0)]));xs.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);document.getElementById('cards').innerHTML=['COMPLETED','AUTO_APPROVED','REQUIRES_HUMAN_REVIEW','FAILED'].map(k=>`<div class="card"><small>${k}</small><div class="num">${counts[k]||0}</div></div>`).join('');document.getElementById('rows').innerHTML=xs.slice(0,20).map(x=>`<tr><td>${x.id.slice(0,8)}</td><td>${x.original_request}</td><td>${x.intent||'-'}</td><td>${x.confidence?x.confidence.toFixed(2):'-'}</td><td>${x.status}</td></tr>`).join('');document.getElementById('queue').innerHTML=xs.filter(x=>x.status==='REQUIRES_HUMAN_REVIEW').map(x=>`<div class="review"><b>${x.original_request}</b><p>Intent: ${x.intent} · Confidence: ${x.confidence?.toFixed(2)}<br>Reason: ${x.reason}</p><button onclick="act('${x.id}','approve')">Approve simulated action</button> <button onclick="act('${x.id}','reject')">Reject</button></div>`).join('')||'<p>No pending cases.</p>'}async function act(id,a){await fetch('/workflows/'+id+'/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviewer:'dashboard-user',note:'Reviewed in demo dashboard'})});load()}load()</script></body></html>
