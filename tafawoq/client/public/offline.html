<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غير متصل — Nourix Academy</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050505; color: #f7f4ec; font-family: "DM Sans", "IBM Plex Sans Arabic", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    .mark { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px; background: linear-gradient(145deg, #f1ce63, #8d6116); display: grid; place-items: center; color: #090909; font-size: 32px; font-weight: 800; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { opacity: 0.75; font-size: 14px; max-width: 320px; margin: 0 auto 20px; line-height: 1.7; }
    button { background: linear-gradient(145deg, #f1ce63, #8d6116); color: #090909; border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <div class="mark">N</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>هذه الصفحة تحتاج اتصالاً بالإنترنت لعرضها لأول مرة. الصفحات التي زرتها سابقًا ستبقى متاحة.</p>
    <button onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
