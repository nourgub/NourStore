<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ store_name }}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="shell">
  <section class="hero">
    <span class="eyebrow">مساعد المبيعات الذكي</span>
    <h1>{{ store_name }}</h1>
    <p>اسأل عن المنتجات، الأسعار، المخزون، التوصيل أو حالة طلبك.</p>
  </section>
  <section class="chat-card">
    <div id="messages" class="messages" aria-live="polite">
      <div class="bubble bot">مرحبًا، كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    <form id="chat-form">
      <input id="message" autocomplete="off" placeholder="مثال: هل يوجد Samsung A55؟" maxlength="2000" aria-label="رسالتك">
      <button id="send">إرسال</button>
    </form>
  </section>
</main>
<script src="/static/chat.js"></script>
</body>
</html>
