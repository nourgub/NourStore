<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة {{ store_name }}</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="shell"><section class="hero"><span class="eyebrow">لوحة الإدارة</span><h1>الطلبات الواردة</h1><p>أدخل رمز الإدارة لعرض الطلبات وتحديث حالتها.</p></section><section class="panel"><div class="toolbar"><input id="token" placeholder="رمز الإدارة" type="password"><button onclick="loadOrders()">عرض الطلبات</button></div><div id="result" class="table-wrap"></div></section></main>
<script>
async function loadOrders(){const token=document.getElementById('token').value;const r=await fetch('/api/orders',{headers:{'X-Admin-Token':token}});const data=await r.json();if(!r.ok){document.getElementById('result').textContent=data.error;return;}document.getElementById('result').innerHTML='<table><tr><th>رقم</th><th>العميل</th><th>الهاتف</th><th>الولاية</th><th>المجموع</th><th>الحالة</th></tr>'+data.map(o=>`<tr><td>${o.id}</td><td>${o.customer}</td><td>${o.phone}</td><td>${o.wilaya}</td><td>${o.total} DA</td><td><select onchange="changeStatus(${o.id},this.value)"><option>${o.status}</option><option>confirmed</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></td></tr>`).join('')+'</table>';window.adminToken=token;}
async function changeStatus(id,status){await fetch('/api/orders/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Token':window.adminToken},body:JSON.stringify({status})});}
</script></body></html>
