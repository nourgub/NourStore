# Tafawoq with a fully self-hosted MySQL — zero external service, zero
# account with any company. Runs on any machine that has Docker installed.
#
# Usage:
#   1. cp .env.example .env   and fill in real values — at least
#      JWT_SECRET, MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD and REDIS_PASSWORD
#      (compose refuses to start without them; the server also refuses
#      the example placeholders in production, see server/_core/env.ts).
#   2. docker compose up -d
#
# The app container applies every not-yet-applied drizzle/*.sql migration
# on start (tracked in a _migrations table), so this is safe on every
# `docker compose up`. Data lives in Docker volumes that survive restarts
# and `docker compose down` (only `docker compose down -v` erases them).
#
# Only the app is reachable from outside. MySQL and Redis are published on
# 127.0.0.1 only (handy for a local client or backups on this machine, never
# reachable from the network — Docker's published ports bypass host
# firewalls like ufw, so binding to loopback matters).

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      # An existing deployment keeps the names in its .env (see docs/LEGACY.md).
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tafawoq}
      MYSQL_USER: ${MYSQL_USER:-tafawoq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - nourix_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Shared rate limits when several app instances run behind a load
    # balancer; a single instance works without it (in-memory fallback).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - nourix_redis_data:/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-tafawoq}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-tafawoq}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TAFAWOQ_MEETING_BASE_URL: ${TAFAWOQ_MEETING_BASE_URL:-}
      TAFAWOQ_AI_DAILY_CALLS: ${TAFAWOQ_AI_DAILY_CALLS:-}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-google}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Files (exercise photos, recorded voices): local disk in the uploads
      # volume, or any S3-compatible bucket.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # AI teacher: optional Claude-written content (it runs fully without it).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAFAWOQ_MODEL: ${TAFAWOQ_MODEL:-}
      TAFAWOQ_BAC_DATE: ${TAFAWOQ_BAC_DATE:-}
      # Teacher voices. Piper (free) is fetched into the uploads volume on
      # first start; the paid voices are used only when their keys are set.
      TAFAWOQ_PIPER_DIR: ${TAFAWOQ_PIPER_DIR:-/app/uploads/piper}
      TAFAWOQ_TTS_CACHE_DIR: ${TAFAWOQ_TTS_CACHE_DIR:-/app/uploads/tts-cache}
      TAFAWOQ_VOICE_PACK_MALE: ${TAFAWOQ_VOICE_PACK_MALE:-}
      TAFAWOQ_VOICE_PACK_FEMALE: ${TAFAWOQ_VOICE_PACK_FEMALE:-}
      TAFAWOQ_VOICE_PACK_RATE: ${TAFAWOQ_VOICE_PACK_RATE:-}
      TAFAWOQ_TASSILI_URL: ${TAFAWOQ_TASSILI_URL:-}
      TAFAWOQ_TASSILI_TOKEN: ${TAFAWOQ_TASSILI_TOKEN:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      TAFAWOQ_AZURE_VOICE_MALE: ${TAFAWOQ_AZURE_VOICE_MALE:-}
      TAFAWOQ_AZURE_VOICE_FEMALE: ${TAFAWOQ_AZURE_VOICE_FEMALE:-}
      TAFAWOQ_AZURE_MONTHLY_CHARS: ${TAFAWOQ_AZURE_MONTHLY_CHARS:-}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
      TAFAWOQ_TTS_MONTHLY_CHARS: ${TAFAWOQ_TTS_MONTHLY_CHARS:-}
      TAFAWOQ_TTS_VOICE: ${TAFAWOQ_TTS_VOICE:-}
      TAFAWOQ_TTS_VOICE_FEMALE: ${TAFAWOQ_TTS_VOICE_FEMALE:-}
      TAFAWOQ_TTS_WARMUP: ${TAFAWOQ_TTS_WARMUP:-}
      TAFAWOQ_SPOKEN_VARIANTS: ${TAFAWOQ_SPOKEN_VARIANTS:-}
    volumes:
      - nourix_uploads:/app/uploads

# The volume names (nourix_*) predate the platform's rename to Tafawoq and
# are kept on purpose: renaming a volume would start an existing deployment
# on a new, EMPTY database. See docs/LEGACY.md.
volumes:
  nourix_mysql_data:
  nourix_uploads:
  nourix_redis_data:
